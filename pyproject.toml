[project]
name = "spiral-session-manager"
version = "1.0.0"
description = "Background session and .srec coil management for the Spiral Codex"
authors = [{ name = "Sir Benjamin" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
spiral-session = "spiral_session_manager.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["spiral_session_manager*"]